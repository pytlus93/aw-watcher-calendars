[package]
name = "aw-watcher-calendars"
version = "1.0.0"
edition = "2021"
description = "Scheduled calendar context importer managed by ActivityWatch"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ical = "0.11"
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
url = "2"
fs2 = "0.4"
